version: '3.3'

services:

  front-end:
    build:
      context: ../wemay
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    hostname: front

  nginx:
    build:
      context: ./nginx/local
    ports:
      - "80:80"
    volumes:
      - ./src/core/static:/home/app/web/static
      - ./src/core/media:/home/app/web/media


  back-end:
    user: "root"
    build:
      context: ./src
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py collectstatic --noinput  && python manage.py makemigrations && python manage.py migrate &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --access-logfile -"
#    volumes:
#      - static_volume:/home/app/web/static
#      - media_volume:/home/app/web/media
    ports:
      - "8000:8000"
    env_file:
      - ./src/.env/


  db:
    image: postgres:15.1-alpine3.17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data/
    env_file:
      - ./src/.env/

volumes:
  postgres_data:
  static_volume:
  media_volume: